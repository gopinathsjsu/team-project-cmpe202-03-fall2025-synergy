spring:
  datasource:
    url: jdbc:mysql://localhost:3306/synergy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: synergy
    password: synergy_pw
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.web: INFO

