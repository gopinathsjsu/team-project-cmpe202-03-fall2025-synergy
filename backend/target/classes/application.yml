spring:
  application:
    name: campus-marketplace
  
  datasource:
    # Support environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
    # Or use DATABASE_URL format: postgresql://user:password@host:port/database
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database-1.cs3oc0aoqhwx.us-east-1.rds.amazonaws.com:5432/campus_marketplace}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.example.app: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-32-characters-long
  expiration: 86400000  # 24 hours in milliseconds
