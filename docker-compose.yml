version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: campus-marketplace-db
    environment:
      POSTGRES_DB: campus_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - campus-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: campus-marketplace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campus-network

  # Embeddings Service (Python FastAPI)
  embeddings:
    build:
      context: ./embeddings-service
      dockerfile: Dockerfile
    container_name: campus-marketplace-embeddings
    ports:
      - "8001:8001"
    networks:
      - campus-network

  # Backend API (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: campus-marketplace-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://database-1.cs3oc0aoqhwx.us-east-1.rds.amazonaws.com:5432/campus_marketplace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      EMBEDDINGS_SERVICE__URL: http://embeddings:8001
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    depends_on:
      - redis
      - embeddings
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    networks:
      - campus-network

  # Frontend (React with Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: campus-marketplace-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_WS_URL: ws://localhost:8080/ws
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - campus-network

  # Nginx Reverse Proxy (for production-like setup)
  # nginx:
  #   image: nginx:alpine
  #   container_name: campus-marketplace-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - campus-network

volumes:
  postgres_data:
  redis_data:
  maven_cache:
  node_modules:

networks:
  campus-network:
    driver: bridge
